# Nav2 tuning for the medical robot.
#
# Frames: the STM32 reports field coordinates, so field_map.yaml (metres) is
# the map frame, odom->base_link is the chassis dead reckoning, and the Livox
# cloud arrives in base_link through a static transform. There is no AMCL:
# the chassis is the only localisation source.
#
# All X/Y below are ROS metres: +X forward, +Y left, +yaw counter-clockwise.
# Field millimetres convert as (x_m = field_y_mm/1000, y_m = -field_x_mm/1000).

# Experimental OPS slip monitor. The Nav2 static map contains planning-only
# fixtures that may not physically exist, so it must not be treated as a
# localization reference. The default temporal mode instead uses robust
# frame-to-frame Mid360 matching. Keep monitor_only true until field logs
# establish safe quality and disagreement thresholds; this node currently
# never publishes TF.
lidar_odometry_guard:
  ros__parameters:
    use_sim_time: false
    enabled: true
    monitor_only: true
    cloud_topic: /livox/lidar_filtered
    odom_topic: /odom
    map_topic: /map
    # Enable only with a separate map whose occupied cells all correspond to
    # observable physical structures. Leave false for the current field.
    use_static_map_filter: false

    # Two comparisons per second are enough to expose wheel slip without
    # recreating the previous high-CPU point-cloud load.
    process_period_s: 0.50
    max_window_s: 1.0
    max_odom_sync_error_s: 0.15
    min_range: 0.35
    max_range: 5.0
    min_height: 0.08
    max_height: 0.60
    voxel_size: 0.08
    max_points: 600

    # Parameters used only when use_static_map_filter is explicitly enabled.
    static_map_tolerance: 0.30
    occupied_threshold: 65
    min_reference_points: 60

    max_correspondence_distance: 0.20
    max_iterations: 8
    trim_fraction: 0.75
    min_inlier_ratio: 0.45
    max_rmse: 0.09
    min_geometry_ratio: 0.02
    # A person-sized local cluster is not sufficient evidence. Trust a window
    # only when matched geometry spans at least one metre and contains more
    # than one observable surface direction.
    min_spatial_extent: 1.0

    # This only raises /medical_nav/ops_slip_suspected. Three consecutive
    # trustworthy half-second windows prevent a person or sparse scan from
    # causing a one-frame alarm.
    slip_translation_threshold: 0.08
    required_bad_windows: 3
    required_good_windows: 3

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    transform_tolerance: 0.5
    # obstacle.launch.py rewrites this to the installed absolute path. The
    # custom tree retains Nav2's recovery flow and replans the live route at
    # 1 Hz so retained routes do not restart FollowPath twice per second.
    default_nav_to_pose_bt_xml: "navigate_to_pose_1hz.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: [
      "FollowPathNurse",
      "FollowPathHeadingHold",
      "FollowPathLateralHold"
    ]
    odom_topic: /odom

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 15.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.10

    # Nurse-station scan profile: MPPI owns vx, vy and wz so it can turn
    # toward each QR viewpoint. Lateral sampling is kept moderate because the
    # scan path is short and should not inherit the Bed 1-3 exploration cost.
    FollowPathNurse:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 40
      model_dt: 0.05
      batch_size: 1200
      vx_std: 0.30
      vy_std: 0.28
      wz_std: 0.15
      vx_max: 3.00
      vx_min: -3.00
      vy_max: 3.00
      wz_max: 0.80
      iteration_count: 1
      prune_distance: 3.5
      transform_tolerance: 0.3
      temperature: 0.25
      gamma: 0.015
      motion_model: "Omni"
      visualize: true
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.0
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
        "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
        "TwirlingCritic"
      ]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0
        critical_cost: 60.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 0.50
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        threshold_to_consider: 10.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.35
        offset_from_furthest: 10
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        offset_from_furthest: 8
        threshold_to_consider: 0.8
      PathAngleCritic:
        enabled: false
        cost_power: 1
        cost_weight: 1.5
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 1
      TwirlingCritic:
        enabled: true
        twirling_cost_power: 1
        twirling_cost_weight: 10.0

    # Bed/Home travel profile: MPPI explores translation only. Its small wz
    # envelope keeps the rollout model near the fixed 0-degree task heading;
    # stm32_bridge replaces the outgoing wz with the HWT101CT PID command.
    # Bias exploration toward the longitudinal field legs and keep rewarding
    # path progress closer to the goal; the approach limiter below retains
    # authority over the final stopping envelope.
    FollowPathHeadingHold:
      plugin: "nav2_mppi_controller::MPPIController"
      # A 1.5 s longitudinal rollout prevents the final approach from
      # converging to approximately remaining_distance / 2.0 s. At the
      # 3.0 m/s ceiling it still evaluates 4.5 m ahead, beyond the 2.25 m
      # braking distance enforced by the downstream 2.0 m/s^2 envelope.
      time_steps: 30
      model_dt: 0.05
      batch_size: 1200
      vx_std: 0.80
      vy_std: 0.28
      wz_std: 0.02
      vx_max: 3.00
      vx_min: -3.00
      vy_max: 3.00
      wz_max: 0.05
      iteration_count: 1
      prune_distance: 3.5
      transform_tolerance: 0.3
      temperature: 0.25
      gamma: 0.015
      motion_model: "Omni"
      visualize: true
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.0
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
        "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
        "TwirlingCritic"
      ]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0
        critical_cost: 60.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 0.50
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        threshold_to_consider: 10.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.35
        offset_from_furthest: 10
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 16.0
        offset_from_furthest: 8
        threshold_to_consider: 0.50
      PathAngleCritic:
        enabled: false
        cost_power: 1
        cost_weight: 1.5
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 1
      TwirlingCritic:
        enabled: true
        twirling_cost_power: 1
        twirling_cost_weight: 10.0

    # Bed 1 -> Bed 3 profile: retain the fixed-heading rollout, but widen vy
    # sampling so the 45-degree X-drive finds lateral cone-avoidance paths in
    # fewer MPPI iterations without imposing that search on other legs.
    FollowPathLateralHold:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 40
      model_dt: 0.05
      batch_size: 1200
      vx_std: 0.30
      vy_std: 0.40
      wz_std: 0.02
      vx_max: 3.00
      vx_min: -3.00
      vy_max: 3.00
      wz_max: 0.05
      iteration_count: 1
      prune_distance: 3.5
      transform_tolerance: 0.3
      temperature: 0.25
      gamma: 0.015
      motion_model: "Omni"
      visualize: true
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.0
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
        "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
        "TwirlingCritic"
      ]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0
        critical_cost: 60.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 0.50
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        threshold_to_consider: 10.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.35
        offset_from_furthest: 10
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        offset_from_furthest: 8
        threshold_to_consider: 0.8
      PathAngleCritic:
        enabled: false
        cost_power: 1
        cost_weight: 1.5
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 1
      TwirlingCritic:
        enabled: true
        twirling_cost_power: 1
        twirling_cost_weight: 10.0

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      # This planner builds a private long-range preference field from the
      # live global costmap. It can therefore avoid narrow, obstacle-dense
      # shortcuts without enlarging the red/cyan inflation shown in RViz.
      plugin: "medical_clearance_planner/ClearancePlanner"
      tolerance: 0.10
      allow_unknown: false
      max_planning_time: 1.5

      # Model the physical 45-degree X-drive feasible set. Body translation
      # is capped by a 3.0 m/s circle; wheel travel uses the matching
      # (|Vx|+|Vy|)/sqrt(2) projection and a 3.0 m/s physical wheel cap.
      forward_speed: 3.00
      reverse_speed: 3.00
      lateral_speed: 3.00
      max_planar_speed: 3.00
      max_wheel_speed: 3.00
      max_time_ratio: 1.10
      # At 3 m/s, 0.50 s allowed up to 1.5 m of extra detour. Keep only
      # 0.25 s so clearance search cannot turn short field legs into long
      # zigzags while the 10% proportional budget remains available.
      min_time_slack: 0.25

      # Safety risk is a secondary objective inside that bounded time budget;
      # it never turns a short corridor into an unbounded 17x distance cost.
      costmap_weight: 3.0
      # Prefer enough separation that the real nurse station and the Bed 3
      # cone are handled by the global route instead of repeated Approach
      # throttling. The unchanged time budget still bounds any detour.
      preferred_clearance: 0.65
      clearance_weight: 12.0
      clearance_power: 2.0
      density_radius: 0.60
      density_weight: 5.0
      density_normalization: 0.18

      # Fade only the private preference near precision start/goal regions.
      # Lethal and footprint-collision cells remain non-traversable.
      goal_exemption_radius: 0.75
      start_exemption_radius: 0.45
      simplification_cost_tolerance: 1.06
      # Accept a simplified diagonal when its wheel-feasible travel time is no
      # slower than the source polyline; reject only physically slower cuts.
      simplification_time_tolerance: 1.01

      # Keep the final simplified/blind-zone-shaped route while it remains
      # collision-free. Switch only when at least 0.50 s faster, or at least
      # 55% safer without becoming slower. A blocked retained route still
      # switches immediately.
      route_switch_risk_improvement: 0.55
      route_switch_time_improvement: 0.50
      route_switch_max_slowdown: 0.00
      route_reuse_max_distance: 0.50

      # Four aluminium profiles follow the 45-degree X-drive wheel axes and
      # form four Mid360 shadow strips. A long simplified path segment that
      # falls inside one strip receives a collision-checked lateral dogleg,
      # creating parallax without changing the fixed task heading.
      blind_zone_enabled: true
      blind_zone_angles_deg: [45.0, 135.0, -135.0, -45.0]
      blind_zone_half_width_deg: 7.0
      blind_zone_margin_deg: 3.0
      blind_zone_min_segment_length: 1.0
      blind_zone_min_lateral_offset: 0.18
      blind_zone_lateral_offset: 0.32
      blind_zone_max_detour_time_ratio: 1.25

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      # Round the clearance planner's safe polyline corners before MPPI sees
      # them. The smoother checks the global costmap, so it cannot trade the
      # nurse-station clearance for a shorter curve.
      # Keep the original, conservative geometry weights so the 20 kg chassis
      # does not overshoot the final Bed 3 turn. The behavior tree grants this
      # profile more computation time without changing its path authority.
      w_data: 0.20
      w_smooth: 0.35
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: false

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # Keep these at the NUC linear limit. The STM32 repeats the matching
    # 3.00 m/s planar and wheel-surface hard caps as a lower-level guard.
    max_velocity: [3.00, 3.00, 0.80]
    min_velocity: [-3.00, -3.00, -0.80]
    # Humble MPPI has no ax/ay/az parameters, so this is the effective normal
    # acceleration and braking envelope. Collision Monitor emergency stops
    # still command zero.
    # ROS body axes: X forward/backward, Y left/right. Long lateral legs
    # showed MPPI reversing vy while the smoother still commanded motion
    # toward the bed for 0.73 s at the former 1.3 m/s^2 braking limit.
    # Raise longitudinal acceleration so HeadingHold reaches its 3.0 m/s
    # cruise speed sooner. Stronger lateral braking arrests Bed 1-3 overshoot;
    # max_decel values must remain negative.
    max_accel: [2.5, 2.2, 1.8]
    max_decel: [-2.0, -2.6, -2.0]
    odom_topic: /odom
    odom_duration: 0.1

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    # Preserve the bed/home speed envelope, then apply the field-tested Git
    # collision profile in one monitor before forwarding commands to STM32.
    cmd_vel_in_topic: /cmd_vel_home_limited
    cmd_vel_out_topic: /cmd_vel_safe
    transform_tolerance: 0.2
    source_timeout: 0.3
    base_shift_correction: True
    stop_pub_timeout: 0.5
    polygons: ["ApproachPolygon", "StopPolygon"]
    observation_sources: ["livox"]

    ApproachPolygon:
      type: "polygon"
      # Restore the field-tested short prediction horizon. It reacts near an
      # obstacle without repeatedly throttling on distant sparse lidar points.
      points: [0.28, 0.0, 0.20, -0.20, 0.0, -0.28, -0.20, -0.20, -0.28, 0.0, -0.20, 0.20, 0.0, 0.28, 0.20, 0.20]
      action_type: "approach"
      time_before_collision: 1.0
      simulation_time_step: 0.1
      # Require a small cluster before predictive slowdown so isolated lidar
      # returns do not repeatedly throttle the chassis. The tighter stop zone
      # deliberately retains its three-point trigger below.
      max_points: 5
      visualize: True
      enabled: True

    StopPolygon:
      type: "polygon"
      # Installed Humble collision_monitor expects a flat double array.
      # Keep only 35 mm beyond the measured 0.23 m body radius. This catches
      # imminent contact without stopping normal 0.30 m bed approaches.
      points: [0.265, 0.0, 0.187, -0.187, 0.0, -0.265, -0.187, -0.187, -0.265, 0.0, -0.187, 0.187, 0.0, 0.265, 0.187, 0.187]
      action_type: "stop"
      max_points: 3
      visualize: True
      enabled: True

    livox:
      type: "pointcloud"
      # Emergency collision checking bypasses ground RANSAC and cone
      # clustering. Planner costmaps still use the enriched lidar_nav cloud.
      topic: /livox/lidar_safety
      max_height: 0.60
      min_height: 0.12
      enabled: True

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      # Keep a 0.5 m clearing-only band before returns leave the rolling
      # window. This prevents a fast-moving person from leaving a marked cell
      # at the edge: mark through 5.5 m, clear through the 6.0 m map radius.
      # A 14 m rolling window keeps a complete 3.0 m/s, 2 s MPPI rollout plus
      # the chassis footprint inside the local map during sustained cruise.
      width: 14
      height: 14
      resolution: 0.05
      # Measured chassis radius: 23 cm. The inflation layer below adds the
      # navigation clearance; do not fold that clearance into robot_radius.
      robot_radius: 0.23
      # Humble MPPI requires an explicit polygon when CostCritic checks the
      # complete footprint. This 16-gon approximates the measured 0.23 m
      # circular chassis while preserving the narrow bed parking clearance.
      footprint: "[[0.2300, 0.0000], [0.2125, 0.0880], [0.1626, 0.1626], [0.0880, 0.2125], [0.0000, 0.2300], [-0.0880, 0.2125], [-0.1626, 0.1626], [-0.2125, 0.0880], [-0.2300, 0.0000], [-0.2125, -0.0880], [-0.1626, -0.1626], [-0.0880, -0.2125], [0.0000, -0.2300], [0.0880, -0.2125], [0.1626, -0.1626], [0.2125, -0.0880]]"
      footprint_padding: 0.0
      # The rolling local map must also contain fixed field furniture.
      # Without StaticLayer, MPPI only sees the live Livox cloud and can
      # cut into a nurse station/bed when the chassis or lidar occludes it.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      # The field has no idea where the robot is, so unexplored space is
      # treated as drivable rather than blocking the whole plan.
      track_unknown_space: false

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.25

      # A 2-D PointCloud2 obstacle layer matches the planar chassis and clears
      # moving people as reliably as the proven global layer. VoxelLayer left
      # stale height cells behind after a person or box moved away.
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        combination_method: 1
        footprint_clearing_enabled: True
        observation_sources: livox
        livox:
          topic: /livox/lidar_nav
          min_obstacle_height: 0.08
          max_obstacle_height: 0.60
          clearing: True
          marking: True
          data_type: "PointCloud2"
          observation_persistence: 0.0
          # Match the larger rolling window: clear stale returns to the map
          # edge and retain enough marked range for 2.6-2.8 m/s cruise.
          raytrace_max_range: 6.0
          raytrace_min_range: 0.10
          obstacle_max_range: 5.5
          obstacle_min_range: 0.10

      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      # Update faster than publication so newly visible competition cones can
      # affect the 2 Hz replanner before the chassis reaches the stop polygon.
      update_frequency: 4.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      # Same physical footprint as the local costmap.
      robot_radius: 0.23
      footprint: "[[0.2300, 0.0000], [0.2125, 0.0880], [0.1626, 0.1626], [0.0880, 0.2125], [0.0000, 0.2300], [-0.0880, 0.2125], [-0.1626, 0.1626], [-0.2125, 0.0880], [-0.2300, 0.0000], [-0.2125, -0.0880], [-0.1626, -0.1626], [-0.0880, -0.2125], [0.0000, -0.2300], [0.0880, -0.2125], [0.1626, -0.1626], [0.2125, -0.0880]]"
      footprint_padding: 0.0
      resolution: 0.05
      # Exactly the surveyed field after conversion:
      # ROS x = field +Y (-0.5..6.5), ROS y = field -X (-3.5..3.5).
      # Humble declares these parameters as integers (metres).
      width: 7
      height: 7
      origin_x: -0.5
      origin_y: -3.5
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      # The field boundary and fixtures are hand surveyed, so they are baked
      # into static_map.pgm and the live lidar only adds what is new.
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # Keep fixed beds, bedside cabinets, nurse station and boundary in the
        # static map. Random competition obstacles are supplied by Livox via
        # obstacle_layer and must not be baked into this map.
        enabled: true
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: livox
        livox:
          topic: /livox/lidar_nav
          min_obstacle_height: 0.08
          max_obstacle_height: 0.60
          clearing: True
          marking: True
          data_type: "PointCloud2"
          # Keep two 10 Hz filtered clouds to bridge the Mid360's
          # non-repetitive scan without restoring the old 0.3 s far-noise
          # trail. Cone disks retain their independent validated persistence.
          observation_persistence: 0.2
          raytrace_max_range: 5.0
          raytrace_min_range: 0.10
          # Use the previously field-tested range and retain a 0.5 m
          # clearing-only band. At 3.0 m/s, 4.5 m gives 1.5 seconds for the
          # 2 Hz global replanner before the local safety layers act.
          obstacle_max_range: 4.5
          obstacle_min_range: 0.10
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.25
      track_unknown_space: false
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "static_map.yaml"

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
