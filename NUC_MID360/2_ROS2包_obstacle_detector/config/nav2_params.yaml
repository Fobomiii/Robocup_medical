# Nav2 tuning for the medical robot.
#
# Frames: the STM32 reports field coordinates, so field_map.yaml (metres) is
# the map frame, odom->base_link is the chassis dead reckoning, and the Livox
# cloud arrives in base_link through a static transform. There is no AMCL:
# the chassis is the only localisation source.
#
# All X/Y below are ROS metres: +X forward, +Y left, +yaw counter-clockwise.
# Field millimetres convert as (x_m = field_y_mm/1000, y_m = -field_x_mm/1000).

# Experimental OPS slip monitor. The Nav2 static map contains planning-only
# fixtures that may not physically exist, so it must not be treated as a
# localization reference. The default temporal mode instead uses robust
# frame-to-frame Mid360 matching. Keep monitor_only true until field logs
# establish safe quality and disagreement thresholds; this node currently
# never publishes TF.
lidar_odometry_guard:
  ros__parameters:
    use_sim_time: false
    enabled: true
    monitor_only: true
    cloud_topic: /livox/lidar_filtered
    odom_topic: /odom
    map_topic: /map
    # Enable only with a separate map whose occupied cells all correspond to
    # observable physical structures. Leave false for the current field.
    use_static_map_filter: false

    # Two comparisons per second are enough to expose wheel slip without
    # recreating the previous high-CPU point-cloud load.
    process_period_s: 0.50
    max_window_s: 1.0
    max_odom_sync_error_s: 0.15
    min_range: 0.35
    max_range: 5.0
    min_height: 0.08
    max_height: 0.60
    voxel_size: 0.08
    max_points: 600

    # Parameters used only when use_static_map_filter is explicitly enabled.
    static_map_tolerance: 0.30
    occupied_threshold: 65
    min_reference_points: 60

    max_correspondence_distance: 0.20
    max_iterations: 8
    trim_fraction: 0.75
    min_inlier_ratio: 0.45
    max_rmse: 0.09
    min_geometry_ratio: 0.02
    # A person-sized local cluster is not sufficient evidence. Trust a window
    # only when matched geometry spans at least one metre and contains more
    # than one observable surface direction.
    min_spatial_extent: 1.0

    # This only raises /medical_nav/ops_slip_suspected. Three consecutive
    # trustworthy half-second windows prevent a person or sparse scan from
    # causing a one-frame alarm.
    slip_translation_threshold: 0.08
    required_bad_windows: 3
    required_good_windows: 3

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    transform_tolerance: 0.5
    # obstacle.launch.py rewrites this to the installed absolute path. The
    # custom tree retains Nav2's recovery flow and replans the live route at
    # 1 Hz without starving the lidar safety pipeline.
    default_bt_xml_filename: "navigate_to_pose_1hz.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    odom_topic: /odom

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 15.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.10

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # MPPI is a sampling controller: it rolls out thousands of trajectories
      # every cycle and keeps the collision-free one closest to the plan, so
      # avoidance falls out of the cost function instead of a separate rule.
      # A 2.0 s horizon retains early avoidance while leaving enough CPU for
      # the filtered lidar and Collision Monitor to remain below timeout.
      time_steps: 40
      model_dt: 0.05
      # 1600 samples with a 2.5 s horizon saturated the NUC during navigation
      # and made safety point clouds 0.3-0.6 s stale.
      batch_size: 1200
      # Explore enough of the 2.0 m/s command range. The previous narrow
      # distribution converged around 0.2-0.3 m/s even on an open path.
      vx_std: 0.30
      # The chassis is a 4-wheel omni base. Allow bounded lateral samples so
      # it can sidestep around the fixed beds/cabinets instead of first making
      # a full heading correction. The bridge limits each linear component to
      # 2.00 m/s; the STM32 keeps an independent 4.00 m/s hard cap.
      vy_std: 0.25
      wz_std: 0.30

      vx_max: 2.00
      vx_min: -0.40
      vy_max: 2.00
      wz_max: 0.80

      iteration_count: 1
      # Keep three metres of the global path available to the 2.0 s rollout.
      # The enlarged 8 m local costmap can evaluate this look-ahead without
      # trajectories immediately reaching the rolling-window boundary.
      prune_distance: 3.0
      transform_tolerance: 0.3
      # Prefer the best-progressing samples slightly more decisively while
      # retaining enough averaging to avoid command chatter.
      temperature: 0.25
      gamma: 0.015
      # Use the actual holonomic model. GoalAngleCritic still encourages the
      # requested final heading, while the bounded vy range permits sideways
      # correction during transit.
      motion_model: "Omni"
      # Trajectory markers are diagnostic-only and add avoidable CPU/network
      # load even when RViz is not open.
      visualize: false
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      # Ackermann constraints are zeroed: this is a holonomic base.
      AckermannConstraints:
        min_turning_r: 0.0

      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
        "PathAlignCritic", "PathFollowCritic", "PathAngleCritic"
      ]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      # The only critic that actually repels obstacles. Its weight is high
      # relative to the path critics so the sampler would rather leave the
      # planned line than shave a leg against a bed.
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        critical_cost: 60.0
        # Check the robot centre here so MPPI can still command an escape when
        # the physical footprint starts inside an inflated/lethal region.
        # Cone-base expansion and Collision Monitor remain independent guards.
        consider_footprint: false
        collision_cost: 1000000.0
        # Match the clearance planner's goal exemption. A larger value lets
        # MPPI ignore obstacle preference too early and cut inside the safe
        # global route during the final metre.
        near_goal_distance: 0.75

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        threshold_to_consider: 1.4

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        # Start restoring the requested final yaw while the chassis is still
        # approaching, instead of reaching the point and rotating in place.
        threshold_to_consider: 1.2

      PathAlignCritic:
        enabled: true
        cost_power: 1
        # Permit useful holonomic shortcuts without abandoning the safe path.
        cost_weight: 8.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        # Reward useful progress over the 2 s prediction horizon. With the
        # 0.05 m path spacing, an offset of five biased the optimizer toward
        # the measured 0.2-0.3 m/s command range.
        cost_weight: 8.0
        offset_from_furthest: 10
        threshold_to_consider: 1.4

      PathAngleCritic:
        enabled: true
        cost_power: 1
        # Avoid spending excessive control authority matching path heading.
        cost_weight: 1.5
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 1

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      # This planner builds a private long-range preference field from the
      # live global costmap. It can therefore avoid narrow, obstacle-dense
      # shortcuts without enlarging the red/cyan inflation shown in RViz.
      plugin: "medical_clearance_planner/ClearancePlanner"
      tolerance: 0.10
      allow_unknown: false
      max_planning_time: 1.5

      # Existing Nav2 cell costs remain a secondary input. Clearance and
      # density are explicit terms, so zero-cost gaps are no longer treated
      # as equally attractive open space.
      costmap_weight: 3.0
      preferred_clearance: 0.65
      clearance_weight: 12.0
      clearance_power: 2.0
      density_radius: 0.75
      density_weight: 8.0
      density_normalization: 0.18

      # Fade only the private preference cost near start/goal. Lethal and
      # footprint-collision cells are never exempted. This preserves exact
      # access to the nurse station and bed targets with the real 0.23 m
      # footprint and the existing 0.25 m visible inflation radius.
      goal_exemption_radius: 0.75
      start_exemption_radius: 0.45
      simplification_cost_tolerance: 1.03

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: false

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # Keep these at the NUC linear limit. The STM32 has a separate 4.00 m/s
    # hard cap, so any other command source still has a lower-level guard.
    max_velocity: [2.00, 2.00, 0.80]
    min_velocity: [-0.40, -2.00, -0.80]
    # Raise XY acceleration conservatively from the stable 1.5 m/s^2 profile.
    # Keep the proven braking limits; 4.0/-4.5 m/s^2 caused chassis overshoot.
    # Collision Monitor emergency stops still bypass this ramp and command zero.
    max_accel: [2.0, 2.0, 3.6]
    max_decel: [-1.8, -1.8, -4.5]
    odom_topic: /odom
    odom_duration: 0.1

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    # navigation_launch.py publishes the smoothed command on /cmd_vel.
    # The STM32 bridge listens only to this monitor's safe output.
    cmd_vel_in_topic: /cmd_vel
    cmd_vel_out_topic: /cmd_vel_safe
    transform_tolerance: 0.2
    source_timeout: 0.3
    base_shift_correction: True
    stop_pub_timeout: 0.5
    # Use predictive, speed-dependent limiting for normal obstacle approach.
    # The smaller stop polygon is only the final independent emergency guard.
    polygons: ["ApproachPolygon", "StopPolygon"]
    observation_sources: ["livox"]

    ApproachPolygon:
      type: "polygon"
      # 0.28 m octagon: chassis radius 0.23 m plus 50 mm allowance. Unlike
      # a large fixed stop box, approach projects this shape along cmd_vel and
      # continuously scales the command only when that motion would collide.
      points: [0.28, 0.0, 0.20, -0.20, 0.0, -0.28, -0.20, -0.20, -0.28, 0.0, -0.20, 0.20, 0.0, 0.28, 0.20, 0.20]
      action_type: "approach"
      time_before_collision: 0.8
      simulation_time_step: 0.1
      max_points: 3
      visualize: True
      enabled: True

    StopPolygon:
      type: "polygon"
      # Installed Humble collision_monitor expects a flat double array.
      # Keep only 35 mm beyond the measured 0.23 m body radius. This catches
      # imminent contact without stopping normal 0.30 m bed approaches.
      points: [0.265, 0.0, 0.187, -0.187, 0.0, -0.265, -0.187, -0.187, -0.265, 0.0, -0.187, 0.187, 0.0, 0.265, 0.187, 0.187]
      action_type: "stop"
      max_points: 3
      visualize: True
      enabled: True

    livox:
      type: "pointcloud"
      # Navigation-only cloud includes the known 0.155 m competition-cone
      # base; localisation continues to use the unexpanded filtered cloud.
      topic: /livox/lidar_nav
      # Upright Mid360 optical centre is at z=0.33 m. Keep the band above
      # that height so horizontal returns remain available to safety checks.
      max_height: 0.60
      min_height: 0.08
      enabled: True

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      # Keep a clearing-only band before returns leave the rolling window.
      # This prevents a fast-moving person from leaving a marked cell at the
      # edge: mark through 2.4 m, clear through 2.9 m, map edge at 3.0 m.
      # An 8 m rolling window gives the 2 s MPPI rollout up to 4 m of local
      # obstacle context, instead of truncating faster trajectories at 3 m.
      width: 8
      height: 8
      resolution: 0.05
      # Measured chassis radius: 23 cm. The inflation layer below adds the
      # navigation clearance; do not fold that clearance into robot_radius.
      robot_radius: 0.23
      # Humble MPPI requires an explicit polygon when CostCritic checks the
      # complete footprint. This 16-gon approximates the measured 0.23 m
      # circular chassis while preserving the narrow bed parking clearance.
      footprint: "[[0.2300, 0.0000], [0.2125, 0.0880], [0.1626, 0.1626], [0.0880, 0.2125], [0.0000, 0.2300], [-0.0880, 0.2125], [-0.1626, 0.1626], [-0.2125, 0.0880], [-0.2300, 0.0000], [-0.2125, -0.0880], [-0.1626, -0.1626], [-0.0880, -0.2125], [0.0000, -0.2300], [0.0880, -0.2125], [0.1626, -0.1626], [0.2125, -0.0880]]"
      footprint_padding: 0.0
      # The rolling local map must also contain fixed field furniture.
      # Without StaticLayer, MPPI only sees the live Livox cloud and can
      # cut into a nurse station/bed when the chassis or lidar occludes it.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      # The field has no idea where the robot is, so unexplored space is
      # treated as drivable rather than blocking the whole plan.
      track_unknown_space: false

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.25

      # A 2-D PointCloud2 obstacle layer matches the planar chassis and clears
      # moving people as reliably as the proven global layer. VoxelLayer left
      # stale height cells behind after a person or box moved away.
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        combination_method: 1
        footprint_clearing_enabled: True
        observation_sources: livox
        livox:
          topic: /livox/lidar_nav
          min_obstacle_height: 0.08
          max_obstacle_height: 0.60
          clearing: True
          marking: True
          data_type: "PointCloud2"
          observation_persistence: 0.0
          raytrace_max_range: 2.9
          raytrace_min_range: 0.10
          obstacle_max_range: 2.4
          obstacle_min_range: 0.10

      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      # Two updates per second match publication and avoid repeatedly
      # raytracing several retained full Mid360 clouds between replans.
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      # Same physical footprint as the local costmap.
      robot_radius: 0.23
      footprint: "[[0.2300, 0.0000], [0.2125, 0.0880], [0.1626, 0.1626], [0.0880, 0.2125], [0.0000, 0.2300], [-0.0880, 0.2125], [-0.1626, 0.1626], [-0.2125, 0.0880], [-0.2300, 0.0000], [-0.2125, -0.0880], [-0.1626, -0.1626], [-0.0880, -0.2125], [0.0000, -0.2300], [0.0880, -0.2125], [0.1626, -0.1626], [0.2125, -0.0880]]"
      footprint_padding: 0.0
      resolution: 0.05
      # Exactly the surveyed field after conversion:
      # ROS x = field +Y (-0.5..6.5), ROS y = field -X (-3.5..3.5).
      # Humble declares these parameters as integers (metres).
      width: 7
      height: 7
      origin_x: -0.5
      origin_y: -3.5
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      # The field boundary and fixtures are hand surveyed, so they are baked
      # into static_map.pgm and the live lidar only adds what is new.
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # Keep fixed beds, bedside cabinets, nurse station and boundary in the
        # static map. Random competition obstacles are supplied by Livox via
        # obstacle_layer and must not be baked into this map.
        enabled: true
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: livox
        livox:
          topic: /livox/lidar_nav
          min_obstacle_height: 0.08
          max_obstacle_height: 0.60
          clearing: True
          marking: True
          data_type: "PointCloud2"
          # Retain about three 10 Hz clouds so the non-repetitive Mid360 scan
          # cannot make a stationary obstacle flicker between map updates.
          # Keep this global-only: the local layer must clear people quickly.
          observation_persistence: 0.3
          raytrace_max_range: 5.0
          raytrace_min_range: 0.10
          # Field testing showed intermittent marking near the old 4.0 m
          # boundary. Leave a 0.5 m clearing-only band beyond marking range.
          obstacle_max_range: 4.5
          obstacle_min_range: 0.10
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.25
      track_unknown_space: false
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "static_map.yaml"

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
