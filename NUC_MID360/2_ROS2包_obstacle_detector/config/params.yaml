obstacle_detector:
  ros__parameters:
    # ── 订阅话题 ────────────────────────────────────────────────
    # 实际驱动发布在 /livox/lidar（不是 /livox/lidar_PointCloud2）
    topic: /livox/lidar

    # ── 前向检测距离范围 (米) ─────────────────────────────────────
    # 雪糕筒放置在前方约 40-50cm 处
    dist_min: 0.40
    dist_max: 0.50

    # ── 横向粗过滤 ±y (米) ───────────────────────────────────────
    # 初步剔除完全偏离的点，不影响大物体过滤
    y_limit: 0.30

    # ── 高度过滤 (米) ────────────────────────────────────────────
    # z_min: 忽略地面反射
    # z_max: 雪糕筒高约 0.5-0.7m，可适当调高
    z_min: -0.10
    z_max:  0.50

    # ── 点数范围 ─────────────────────────────────────────────────
    # min_points: 少于此值认为是噪声
    # max_points: 多于此值认为是大物体（箱子/床），直接忽略
    min_points: 5
    max_points: 80

    # ── 横向宽度上限 (米) ← 最关键的大物体过滤参数 ───────────────
    # 雪糕筒横向宽度约 0.10-0.15m
    # 箱子 > 0.30m，床 > 1.0m
    # 推荐设 0.20-0.25m
    y_span_max: 0.25

    # ── 串口配置 ─────────────────────────────────────────────────
    serial_port: /dev/ttyUSB0
    baud_rate: 115200

    # ── 最小发送间隔 (秒) ─────────────────────────────────────────
    # 0.05s = 20Hz，避免串口数据堆积
    send_interval: 0.05
