code_scanner:
  ros__parameters:
    camera_device: /dev/v4l/by-id/usb-DECXIN_CAMERA_DECXIN_CAMERA_01.00.00-video-index0
    # SDYH-8P0P long-focus camera. It assists only the pre-start nurse QR scan;
    # bed CODE128 scanning remains on the primary DECXIN camera.
    tele_camera_device: /dev/v4l/by-id/usb-BLC-240823--A_SDYH-8P0P-video-index0
    width: 1920
    height: 1200
    fps: 30.0
    # Verified on the NUC at USB high-speed: driver-default is YUYV 1920x1080@5.
    # It is opened only while waiting for the start command, then released.
    tele_width: 1920
    tele_height: 1080
    tele_fps: 5.0
    # Give the long-focus camera one bounded pre-start attempt. After timeout,
    # release it and restore the primary wide-angle camera without changing
    # the already planned destination.
    tele_scan_timeout_s: 15.0
    decode_rate_hz: 15.0
    confirm_hits: 2
    confirm_window_s: 0.8
    # Decode the complete view at a lower working resolution on every cycle.
    # The original 1920x1200 frame and rotation sweep remain a periodic fallback.
    decode_width: 1280
    decode_height: 800
    full_resolution_fallback_period: 4
    # Fractions still cover the complete camera view; they do not crop an ROI.
    roi_left: 0.0
    roi_right: 1.0
    roi_top: 0.0
    roi_bottom: 1.0
    full_frame_fallback_period: 6
    # Bed barcodes may be captured while approaching, but not while the robot
    # is still beside the previously visited bed.
    bed_scan_activation_distance_m: 1.5
    pose_timeout_s: 0.5
    power_line_frequency: 1
    auto_exposure: 3
    autofocus: false
    focus_absolute: 630
    preview: false
    preview_topic: /medical_nav/scanner_preview/compressed
    tele_preview_topic: /medical_nav/tele_scanner_preview/compressed
    preview_rate_hz: 8.0
    preview_width: 640
    preview_height: 400
    preview_jpeg_quality: 75
